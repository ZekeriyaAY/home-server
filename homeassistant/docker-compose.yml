services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    volumes:
      - config:/config
      - /var/run/dbus:/run/dbus:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Istanbul
    privileged: true
    labels:
      - glance.name=Home Assistant
      - glance.icon=si:homeassistant
      - glance.url=http://${SERVER-IP}:8123
      - glance.description=Home Automation
      - glance.id=homeassistant
      - glance.category=default

  esphome:
    container_name: esphome
    image: esphome/esphome
    volumes:
      - esphome_config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: no
    privileged: true
    network_mode: host
    labels:
      - glance.name=ESPHome
      - glance.parent=homeassistant
      - glance.category=default

volumes:
    config:
    esphome_config:
