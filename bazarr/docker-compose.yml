services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 6767:6767
    volumes:
      - /opt/media/config/bazarr:/config
      - /opt/media/movies:/movies
      - /opt/media/tv-shows:/tv
