services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - 8090:8090
    volumes:
      - /opt/appdata/beszel:/beszel_data
      - /opt/appdata/beszel-socket:/beszel_socket
    environment:
      APP_URL: http://localhost:8090
    healthcheck:
      # The URL is relative to the container, not the host
      test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
      start_period: 5s # Check 5 seconds after the container starts
      interval: 120s # Then check every 120 seconds after that
    labels:
      - glance.name=Beszel
      - glance.description=Server Monitoring Hub
      - glance.url=http://${SERVER-IP}:8090
      - glance.icon=sh:beszel-light
      - glance.category=default
      - glance.id=beszel

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/appdata/beszel-agent:/var/lib/beszel-agent
      - /opt/appdata/beszel-socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: '${KEY}'
      TOKEN: ${TOKEN}
      HUB_URL: http://localhost:8090
    healthcheck:
      test: ['CMD', '/agent', 'health']
      interval: 120s
    labels:
      - glance.name=Beszel Agent
      - glance.category=default
      - glance.parent=beszel

networks:
  default:
    name: beszel_network
