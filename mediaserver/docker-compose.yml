services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - 8096:8096
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /opt/appdata/mediaserver/config/jellyfin:/config
      - /opt/appdata/mediaserver/cache/jellyfin:/cache
      - /mnt/storage/media:/data/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Istanbul

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - 8989:8989
    volumes:
      - /opt/appdata/mediaserver/config/sonarr:/config
      - /mnt/storage:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Istanbul

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - 7878:7878
    volumes:
      - /opt/appdata/mediaserver/config/radarr:/config
      - /mnt/storage:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Istanbul

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - 6767:6767
    volumes:
      - /opt/appdata/mediaserver/config/bazarr:/config
      - /mnt/storage/media:/data/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Istanbul

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - 9696:9696
    volumes:
      - /opt/appdata/mediaserver/config/prowlarr:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Istanbul

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped

  gluetun: 
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    ports:
      - 9091:9091
    volumes:
      - /opt/appdata/mediaserver/config/gluetun/auth/config.toml:/gluetun/auth/config.toml:ro
    environment:
      - VPN_SERVICE_PROVIDER=windscribe
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - SERVER_REGIONS=${SERVER_REGIONS}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
      
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    depends_on:
      gluetun:
        condition: service_started
    restart: unless-stopped
    network_mode: "service:gluetun"
    # ports:
    #   - 9091:9091
    #   - 51413:51413
    #   - 51413:51413/udp
    volumes:
      - /opt/appdata/mediaserver/config/transmission:/config
      - /opt/appdata/mediaserver/data/torrents/incomplete:/data/torrents/incomplete
      - /mnt/storage/torrents/complete:/data/torrents/complete
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Istanbul
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASSWD}

networks:
  default:
    name: media_network
