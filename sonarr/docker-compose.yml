services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8989:8989
    volumes:
      - /opt/media/config/sonarr:/config
      - /opt/media/downloads:/downloads
      - /opt/media/tv-shows:/tv
