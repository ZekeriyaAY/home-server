services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "127.0.0.1:25565:25565"
      - "127.0.0.1:19132:19132/udp"
      - "24454:24454/udp"
    volumes:
      - /opt/appdata/minecraft/data:/data
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      TYPE: "FABRIC"
      VERSION: "26.2"
      MEMORY: "4G"
      DIFFICULTY: "hard"
      MAX_PLAYERS: "4"
      TZ: "Europe/Istanbul"
      MOTD: "⛏️ ZAY Minecraft Server ⚔️\n§eHızlı koşan atın boku seyrek düşer"
      LOG_TIMESTAMP: "true"
      MODRINTH_PROJECTS: |
        fabric-api
        geyser:beta
        fallingtree
        sgtveinminer
        ping-wheel
        jei:beta
        armor-stand-arms
        tool-trims:beta
        floodgate
        simple-voice-chat
        anti-xray
      RCON_CMDS_STARTUP: |-
        gamerule minecraft:players_sleeping_percentage 0

  backup:
    image: itzg/mc-backup:latest
    container_name: minecraft-backup
    restart: unless-stopped
    depends_on:
      - minecraft
    volumes:
      - /opt/appdata/minecraft/data:/data:ro
      - /opt/appdata/minecraft/backups:/backups
    environment:
      RCON_HOST: minecraft
      BACKUP_INTERVAL: "6h"
      PRUNE_BACKUPS_DAYS: "7"

  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    container_name: minecraft-playit
    restart: unless-stopped
    network_mode: host
    environment:
    - SECRET_KEY=${PLAYIT_SECRET_KEY}

networks:
  default:
    name: minecraft_network
