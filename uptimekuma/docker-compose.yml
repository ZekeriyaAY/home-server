services:
  uptimekuma:
    image: louislam/uptime-kuma:2
    container_name: uptimekuma
    restart: unless-stopped
    networks:
      - default
      - n8n_network
      - minecraft_network
    ports:
      - "3001:3001"
    volumes:
      - /opt/appdata/uptimekuma/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  default:
    name: uptimekuma_network
  n8n_network:
    external: true
  minecraft_network:
    external: true
